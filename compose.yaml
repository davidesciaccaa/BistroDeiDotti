services:
  backend:
    build:
      context: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: prod
      APP_CORS_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      # Set ADMIN_PASSWORD (e.g. in a .env file next to this compose file) to enable /admin.
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      MENU_DATA_DIRECTORY: /app/data
      MENU_LEGACY_OVERRIDES_FILE: /app/data/menu-overrides.json
      MENU_TRANSLATION_ENABLED: ${MENU_TRANSLATION_ENABLED:-false}
      DEEPL_AUTH_KEY: ${DEEPL_AUTH_KEY:-}
    volumes:
      - menu-data:/app/data
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  menu-data:
