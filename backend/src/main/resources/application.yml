spring:
  application:
    name: bistro-dei-dotti-api
  jackson:
    default-property-inclusion: non_null
  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  admin:
    # Blank disables /api/admin/** entirely.
    password: ${ADMIN_PASSWORD:}
    session-ttl: ${ADMIN_SESSION_TTL:8h}
  menu:
    data-directory: ${MENU_DATA_DIRECTORY:data}
    default-resource: menu.default.json
    legacy-overrides-file: ${MENU_LEGACY_OVERRIDES_FILE:${MENU_OVERRIDES_FILE:data/menu-overrides.json}}
  translation:
    enabled: ${MENU_TRANSLATION_ENABLED:false}
    auth-key: ${DEEPL_AUTH_KEY:}
    source-language: IT
    target-languages:
      - EN
      - DE
    timeout: 10s
